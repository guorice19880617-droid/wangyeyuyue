<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>预约表</title>
</head>

<body>

<h2>预约记录</h2>

<table border="1">

<tr>
<th>日期</th>
<th>时间</th>
<th>姓名</th>
<th>操作</th>
</tr>

{% for r in rows %}

<tr>
<td>{{r[0]}}</td>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>

<td>
<form action="/delete" method="post">
<input type="hidden" name="day" value="{{r[0]}}">
<input type="hidden" name="time" value="{{r[1]}}">
<button type="submit">删除</button>
</form>
</td>

</tr>

{% endfor %}

</table>

</body>

</html>
