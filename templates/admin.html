<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>预约表</title>
</head>

<body>

<h2>预约记录</h2>

<table border="1">

<tr>
<th>日期</th>
<th>时间</th>
<th>姓名</th>
</tr>

{% for r in rows %}

<tr>
<td>{{r[0]}}</td>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
</tr>

{% endfor %}

</table>

</body>

</html>
