<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>预约系统</title>

<style>

body{
max-width:500px;
margin:auto;
font-family:Arial;
background:#f5f5f5;
}

.header{
background:#2c3e50;
color:white;
padding:15px;
font-size:20px;
text-align:center;
}

.namebox{
padding:10px;
}

input{
width:100%;
padding:10px;
font-size:16px;
}

.card{

background:white;

padding:15px;

margin:10px;

border-radius:10px;

box-shadow:0 2px 5px rgba(0,0,0,0.1);

}

button{

width:100%;

padding:12px;

font-size:16px;

border:none;

border-radius:8px;

background:#4CAF50;

color:white;

margin-top:5px;

}

.booked{

color:red;

font-weight:bold;

}

</style>

</head>

<body>

<div class="header">
预约系统
</div>

<div class="namebox">

<input type="text" id="name" placeholder="请输入姓名">

</div>

{% for day in days %}

<div class="card">

<h3>{{day}}</h3>

{% for time in times %}

<form action="/book" method="post">

<input type="hidden" name="day" value="{{day}}">
<input type="hidden" name="time" value="{{time}}">
<input type="hidden" name="name" id="name_input">

<div>

{{time}}

{% if day + "_" + time in booking %}

<span class="booked"> 已预约</span>

{% else %}

<button onclick="setName()">预约</button>

{% endif %}

</div>

</form>

{% endfor %}

</div>

{% endfor %}

<script>

function setName(){

var name=document.getElementById("name").value

document.getElementById("name_input").value=name

}

</script>

</body>

</html>
