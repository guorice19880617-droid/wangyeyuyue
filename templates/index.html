<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:Arial;
padding:20px;
}

button{
width:100%;
padding:12px;
margin-top:5px;
font-size:16px;
background:#3498db;
color:white;
border:none;
border-radius:8px;
}

</style>

</head>

<body>

<h2>预约系统</h2>

<form method="post" action="/book">

<input name="name" placeholder="请输入姓名" required style="width:100%;padding:10px">

<br><br>

{% for d in days %}

<h3>{{d}}</h3>

{% for t in times %}

{% set key=d+"_"+t %}

{% if key in booking_dict %}

<button disabled>{{t}} 已预约</button>

{% else %}

<button name="day" value="{{d}}" onclick="this.form.time.value='{{t}}'">{{t}} 预约</button>

{% endif %}

{% endfor %}

{% endfor %}

<input type="hidden" name="time">

</form>

<hr>

<div style="text-align:center">

<button onclick="admin()">管理员入口</button>

</div>

<script>

function admin(){

let pwd=prompt("请输入管理员密码")

window.location="/admin?pwd="+pwd

}

</script>

</body>
</html>
